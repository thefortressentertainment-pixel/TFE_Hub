version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fortress
    ports: ['5432:5432']
  redis:
    image: redis:7
    ports: ['6379:6379']
  backend:
    build: ./backend
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fortress
      REDIS_URL: redis://redis:6379
    depends_on: ['db','redis']
  worker:
    build: ./backend
    command: node ../worker/src/processor.js
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fortress
      REDIS_URL: redis://redis:6379
    depends_on: ['db','redis']
  frontend:
    build: ./frontend
    ports: ['8080:80']
