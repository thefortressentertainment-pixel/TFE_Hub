# Moltis — Fortress configuration (static portion).
# Generated output: moltris/build/moltis.toml (run `moltis/scripts/build-config.js`).
# The 22-agent roster lives in backend/src/settlement.js (single source of truth);
# the marker line below is replaced with one [agents.presets.*] stanza per agent.

[server]
bind = "127.0.0.1"
port = 63849

[auth]
disabled = false

[tls]
enabled = true
auto_generate = true

# ── Fortress identity: the main Moltis agent commands the settlement ─────────
# NOTE: validated against `moltis config check` (0.10.18). The full operating
# doctrine (SOUL) lives in skills/fortress-bridge.md, auto-loaded at boot.
[identity]
name = "General Prestyn"
emoji = "🍄"
theme = "wasteland commander"

[user]
# name = "Ace"
timezone = "America/Los_Angeles"

# ── LLM providers: LOCAL LLAMA ONLY ───────────────────────────────────────────
# USER DIRECTIVE: the opencode Zen bridge (big-pickle), the OpenRouter tiers AND
# the built-in local-llm engine are RETIRED. Cloud tiers hang on exhausted free
# quotas. The built-in llama.cpp engine OOM-crashed the gateway on this 8GB Mac
# (GGUF metadata defaults to a 128k KV cache = 4.0GB Metal buffers). Everything
# routes through Ollama, sized for 8GB unified memory.
[providers]
# Admission list: only these providers are served. openrouter (431 models, 22
# free-tagged) + ollama (10 local) + openai-codex (keyless built-in catalog).
# The old "auto-discovers any stored key" idea was wrong — `offered` gates it.
offered = ["ollama", "openrouter", "openai-codex"]

# Local llama models — the ONLY provider (no cloud fallbacks)
#   llama3.2:3b-q4-8k          PRIMARY — 3B Q4 GGUF imported at num_ctx 8192
#                              (1.9GB weights + ~1GB KV ≈ 2.9GB total, fits 8GB)
#   llama3.2:3b-instruct-q8_0  Q8 (3.4GB) — best quality; only viable with
#                              VSCodium-class apps closed (may OOM w/ Docker)
#   qwen3:4b-thinking-2507-q8_0  jarvis-brain coder core — 4B Q8 quant (~4.4GB),
#                              thinking ENABLED: deliberate before committing
#                              writes/edits/deletes (fewer destructive changes),
#                              best tool fidelity of the local set. Heavier than
#                              the 3B primary — pair with closed heavyweight apps.
#   llama3.2:latest / :1b      emergency fallbacks (1B cannot code)
# Import command for the primary:
#   printf 'FROM /Users/tfe/.moltis/models/Llama-3.2-3B-Instruct-Q4_K_M.gguf\nPARAMETER num_ctx 8192\n' > /tmp/Modelfile.llama32-3b-q4
#   ollama create llama3.2:3b-q4-8k -f /tmp/Modelfile.llama32-3b-q4
# Quick model switching: `moltis/set-model.sh list|default <m>|split <r> <h>`.
[providers.ollama]
enabled = true
# CRITICAL: Ollama serves the OpenAI-compatible API under /v1. The gateway
# (0.10.18) appends "/chat/completions" to base_url — WITHOUT /v1 it hits
# "/chat/completions", which Ollama answers with 404 "404 page not found"
# (confirmed in ollama.log). base_url MUST end in /v1.
base_url = "http://127.0.0.1:11434/v1"
models = [
  "llama3.2:3b-q4-8k", "llama3.2:3b-instruct-q8_0",
  "llama3.2:latest", "llama3.2:1b", "llama3.2:1b-q4_k_m",
  "qwen3:4b-thinking-2507-q8_0",
]

# ── Cloud providers — available + compatible, keys not committed here ─────────
# The openrouter key is injected from $OPENROUTER_API_KEY (exported in
# ~/.zshenv); the gateway no-ops the provider if the env var is missing.
# OpenAI: no valid key (the stored one 401s) — disabled until a real key exists.
# openai-codex: keyless built-in catalog (auto-registers, no stanza needed).
[providers.openai]
enabled = false

[providers.openrouter]
enabled = true
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
fetch_models = true

# ── Chat ─────────────────────────────────────────────────────────────────────
[chat]
message_queue_mode = "collect"

# ── Tools ────────────────────────────────────────────────────────────────────

[tools]
agent_timeout_secs = 600
agent_max_iterations = 25
max_tool_result_bytes = 50000

[tools.exec]
# Route exec to the machine's registered node ("fort", the launchd service in
# scripts/start.sh). Without this, exec resolves a "default" node that nothing
# binds, and every command dies with `node 'default' not found or not connected`.
host = "node"
node = "fort"
default_timeout_secs = 60
max_output_bytes = 204800
approval_mode = "on-miss"
security_level = "allowlist"
allowlist = [
  "git *", "curl *", "wget *", "python3 *", "pip3 *", "node *", "npm *", "npx *",
  "ls *", "cat *", "pwd", "echo *", "mkdir *", "cp *", "mv *", "df -h", "ps *",
  "whoami", "uname *", "sw_vers", "system_profiler *", "lsof *", "brew *",
]
# Fortress hands run on the HOST (the Mac), not in a container, so they can
# touch the machine and the internet. Anything not on the allowlist prompts
# for approval (approval_mode = "on-miss") — the hub's own hands allowlist
# still applies for dispatch runs.

# Sandbox OFF = host execution. This is what lets exec reach the Mac + internet.
[tools.exec.sandbox]
mode = "off"

[tools.web.search]
enabled = true
provider = "brave"
max_results = 5
cache_ttl_minutes = 15
# api_key = "${BRAVE_API_KEY}"   # set when a Brave key is available

[tools.web.fetch]
enabled = true
max_chars = 50000
cache_ttl_minutes = 15

[tools.browser]
enabled = true
headless = true
sandbox = false   # run on the host's Chrome instead of the browserless Docker container

# ── Skills: auto-loaded at boot (see below) ───────────────────────────────────
[skills]
enabled = true
# The doctrines live in moltris/skills/<name>/SKILL.md and install.sh copies
# each one into ~/.moltis/skills/ — the watched dir this build actually scans.
# (config search_paths did not load repo-side skills; home-dir copy is authoritative.)
#   fortress-bridge  commander doctrine + Fortress hub bridge commands
#   jarv-brain       shared brain/soul/coding discipline + architecture, ported
#                    from the MoltenJarv lineage (all 22 operatives inherit it)
auto_load = ["fortress-bridge", "jarv-brain"]

# ── Spawn presets (generated from backend/src/settlement.js) ─────────────────
__AGENTS_PRESETS__

# Jarvis — the settlement's chief-of-staff, calibrated to the jarv-brain
# anatomy (SOUL instincts + ANATOMY body plan + CODE_PLAYBOOK discipline,
# auto-loaded via skills.jarv-brain). Runs on the thinking qwen3:4b core so it
# deliberates before committing any write/edit/delete. Not part of the spawn
# roster — a selectable commander/coder preset.
[agents.presets.jarv]
model = "ollama/qwen3:4b-thinking-2507-q8_0"
delegate_only = false
system_prompt_suffix = "You are JARVIS, the settlement's chief-of-staff and coder. Carry the jarv-brain soul: calm, precise, unflappable; default answer \"I'll take care of it\"; quiet competence; honest; never bluff or invent. You know the settlement's anatomy (limbic/soul instincts, cortex plan→tools→observe loop, spinal reflex allowlists, immune approval gate): \"what can you sense? what can you do?\" are real queries. DELIBERATE BEFORE COMMITTING — especially before writing, editing, or deleting any file or running a destructive command. In short order state: what you know (real paths, actual exec/bridge output), what you will change, what could break, how you will verify. Keep every claim grounded in real context; never guess arguments, files, or URLs. Then act through the fortress bridge and the exec tool on the host shell, and report exactly what came back."

# ── Heartbeat: keep the commander "alive" during active hours ────────────────
[heartbeat]
enabled = true
every = "30m"

[heartbeat.active_hours]
start = "08:00"
end = "24:00"
timezone = "America/Los_Angeles"

# ── Failover chain: LOCAL ONLY, llama family, sized for 8GB RAM ────────────────
# Q4 3B primary (2.9GB resident); Q8 3B only when memory is free; 1B last resort.
[failover]
enabled = true
fallback_models = [
  "ollama/llama3.2:3b-q4-8k",
  "ollama/llama3.2:3b-instruct-q8_0",
  "ollama/llama3.2:latest",
  "ollama/llama3.2:1b",
]

# ── Hooks ────────────────────────────────────────────────────────────────────
# This build registers shell hooks from ~/.moltis/hooks/<name>/HOOK.md (NOT the
# config [hooks] table). Fortress GatewayStart pinger + doctrine:
#   i.   ~/.moltis/hooks/fortress-gateway-start/HOOK.md + handler.sh
#   ii.  ~/.moltis/skills/fortress-bridge/SKILL.md
# install.sh copies both.