services:
  - type: web
    name: tfe-hub
    runtime: node
    plan: free
    buildCommand: ./scripts/render-build.sh
    startCommand: node backend/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: tfe-hub-worker
    runtime: node
    plan: free
    buildCommand: ./scripts/render-build.sh
    startCommand: node worker/src/processor.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
