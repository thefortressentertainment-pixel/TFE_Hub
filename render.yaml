services:
  - type: web
    name: tfe-hub
    runtime: node
    plan: free
    buildCommand: ./scripts/render-build.sh
    startCommand: sh -c "node backend/migrations/run.js && node backend/src/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GENIE_MESH_ENABLED
        value: "true"
      - key: GENIE_SATLINK
        value: "false"
      - key: JARV_GENIE_URL
        sync: false
      - key: JARV_GENIE_API_KEY
        sync: false
      - key: JARV_GENIE_OUTBOUND_TOKEN
        sync: false
      - key: GENIE_AI_ENABLED
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: "https://api.deepseek.com/v1"
      - key: DEEPSEEK_MODEL
        value: "deepseek-v4"
      - key: DEEPSEEK_FALLBACK_MODELS
        value: "deepseek-v4,deepseek-chat,deepseek-reasoner"
      - key: DEEPSEEK_FREE
        value: "true"
      - key: DEEPSEEK_MAX_TOKENS
        value: "2000"
      - key: DEEPSEEK_SYSTEM_PROMPT
        sync: false

  - type: web
    name: tfe-hub-worker
    runtime: node
    plan: free
    buildCommand: ./scripts/render-build.sh
    startCommand: node worker/src/processor.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GENIE_MESH_ENABLED
        value: "true"
